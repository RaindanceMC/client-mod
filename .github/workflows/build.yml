name: Build

# Every push and pull request: unit tests of the shared code, the three mod jars, and a real client of each
# game version that has to come up with the mod in it. A tag vX.Y.Z also publishes the jars as a release.

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  # rains-client-protocol comes from the private registry; TLS 1.2 for its SNI quirk.
  REPOSILITE_USERNAME: ${{ vars.REPOSILITE_USERNAME }}
  REPOSILITE_PASSWORD: ${{ secrets.REPOSILITE_PASSWORD }}
  JAVA_TOOL_OPTIONS: -Djdk.tls.client.protocols=TLSv1.2

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      # Reaches every build of the composite: the shared code and its tests, and one jar per game version.
      - name: Build and unit test
        run: ./gradlew build

      # A real client per version; in a singleplayer world the mod has to stay silent.
      - name: Client startup test (26.3)
        timeout-minutes: 15
        run: scripts/headless.sh ./gradlew -p versions/fabric-26.3 runClientGameTest

      - name: Client startup test (26.2)
        timeout-minutes: 15
        run: scripts/headless.sh ./gradlew -p versions/fabric-26.2 runClientGameTest

      - name: Client startup test (1.21.11)
        timeout-minutes: 15
        run: scripts/headless.sh ./gradlew -p versions/fabric-1.21.11 runClientGameTest

      - uses: actions/upload-artifact@v4
        with:
          name: hyades-${{ github.sha }}
          path: versions/*/build/libs/hyades-mc*.jar
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-${{ github.sha }}
          path: versions/*/build/run/clientGameTest/screenshots
          if-no-files-found: ignore

      - name: Release the jars
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(grep '^mod_version=' gradle/shared.properties | cut -d= -f2)"
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "::error::tag $GITHUB_REF_NAME but mod_version $version"; exit 1; }
          gh release create "$GITHUB_REF_NAME" versions/*/build/libs/hyades-mc*-"$version".jar \
            --title "Hyades $version" --generate-notes
