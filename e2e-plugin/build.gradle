plugins {
	id 'java'
}

// Not part of the mod: a Paper plugin for scripts/e2e.sh that does what a module would — puts up a sidebar
// and an action bar through RainsCore — so the clients have something to be shown.
version = project.mod_version
group = project.maven_group

repositories {
	mavenCentral()
	maven {
		name = 'papermc'
		url = 'https://repo.papermc.io/repository/maven-public/'
	}
}

dependencies {
	compileOnly "io.papermc.paper:paper-api:${project.paper_api_version}"
	compileOnly "de.raindancer:RainsCore:${project.rainscore_version}"
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = 'UTF-8'
}

processResources {
	def props = [version: project.version]
	inputs.properties props
	filesMatching('paper-plugin.yml') {
		expand props
	}
}
